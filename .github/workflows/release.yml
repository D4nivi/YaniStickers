name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión semántica a publicar (ej. 1.0.0 o v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi

          CLEAN_VERSION="${RAW_VERSION#v}"
          CLEAN_VERSION="${CLEAN_VERSION#V}"

          if [[ ! "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Error: la versión '$RAW_VERSION' debe tener formato MAJOR.MINOR.PATCH (ej. 1.0.0 o v1.0.0)."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          {
            echo "RELEASE_TAG=v${CLEAN_VERSION}"
            echo "APP_VERSION_NAME=${CLEAN_VERSION}"
            echo "APP_VERSION_CODE=${VERSION_CODE}"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew test lint --no-daemon

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Error: falta el secret ANDROID_KEYSTORE_BASE64 en GitHub."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK for release
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: no se encontró el APK firmado en $APK_SRC"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK_SRC" "${{ runner.temp }}/YaniStickers-v${{ env.APP_VERSION_NAME }}.apk"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: YaniStickers ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: ${{ runner.temp }}/YaniStickers-v${{ env.APP_VERSION_NAME }}.apk
